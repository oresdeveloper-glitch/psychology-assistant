name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: |
          echo "node $(node -v)"
          echo "npm $(npm -v)"
          echo "pwd: $(pwd)"
          ls node_modules/.bin/vite && echo "vite found" || echo "vite not found"
          node node_modules/vite/bin/vite.js build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://orresydeveloper11-khairaty-api.hf.space/api/v1' }}
          BASE_URL: /psychology-assistant/
          CI: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
