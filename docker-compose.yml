version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khairaty
      POSTGRES_PASSWORD: khairaty
      POSTGRES_DB: khairaty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khairaty"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://khairaty:khairaty@db:5432/khairaty
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data

volumes:
  pgdata:
  mosquitto_data:
